<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script>
(function(){var t=localStorage.getItem('lumen_theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen — Learning Gap Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{--bg:#f3efe6;--sf:#faf8f2;--tx:#1c1a16;--mu:#6e685b;--bd:#ddd6c6;--pr:#16233d;--pt:#faf8f2;--ac:#2b4c9b;--prs:#e8e3d6;--ok:#2e6a4d;--oks:#e0eadf;--wn:#9a5a0a;--wns:#f2e4c8;--er:#ad3f2a;--ers:#f3dcd3;--r:6px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14130f;--sf:#1c1b16;--tx:#efe9dc;--mu:#a39c8b;--bd:#34312a;--pr:#ece4d0;--pt:#14130f;--ac:#8fa9ee;--prs:#2a2820;--ok:#86c6a2;--oks:#1d3027;--wn:#e8b05c;--wns:#37290f;--er:#f09a85;--ers:#3c2019}}
:root[data-theme=dark]{--bg:#14130f;--sf:#1c1b16;--tx:#efe9dc;--mu:#a39c8b;--bd:#34312a;--pr:#ece4d0;--pt:#14130f;--ac:#8fa9ee;--prs:#2a2820;--ok:#86c6a2;--oks:#1d3027;--wn:#e8b05c;--wns:#37290f;--er:#f09a85;--ers:#3c2019}
:root[data-theme=light]{--bg:#f3efe6;--sf:#faf8f2;--tx:#1c1a16;--mu:#6e685b;--bd:#ddd6c6;--pr:#16233d;--pt:#faf8f2;--ac:#2b4c9b;--prs:#e8e3d6;--ok:#2e6a4d;--oks:#e0eadf;--wn:#9a5a0a;--wns:#f2e4c8;--er:#ad3f2a;--ers:#f3dcd3}
html[data-theme] body,html[data-theme] .card,html[data-theme] aside,html[data-theme] .side,html[data-theme] .seg,html[data-theme] .nav,html[data-theme] input,html[data-theme] select,html[data-theme] .opt,html[data-theme] .dot,html[data-theme] .crow,html[data-theme] .toast,html[data-theme] .btn,html[data-theme] th,html[data-theme] td,html[data-theme] .bar,html[data-theme] .ex{transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.theme-toggle{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:1px solid var(--bd);background:var(--sf);transition:background .2s,border-color .2s}.theme-toggle:hover{border-color:var(--tx)}.theme-toggle:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.55 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0;letter-spacing:-.02em;line-height:1.15}h1{font-size:36px}h2{font-size:23px}h3{font-size:15.5px;font-weight:600;margin:0}
p{margin:0}.mu{color:var(--mu)}.sm{font-size:13px}.num{font-family:Newsreader,Georgia,serif;font-variant-numeric:lining-nums tabular-nums;font-weight:500;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
aside{background:var(--bg);border-right:1px solid var(--bd);padding:26px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:11px;font:500 23px Newsreader,serif;padding:0 24px 28px;letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:0}.mark:before{content:"L";font:italic 500 17px Newsreader,serif}
.nav{all:unset;cursor:pointer;padding:9px 24px;color:var(--mu);font-weight:500;display:block;border-left:2px solid transparent}
.nav:hover{color:var(--tx)}.nav.on{color:var(--tx);font-weight:600;border-left-color:var(--tx);background:var(--prs)}
main{padding:34px 48px 80px;max-width:1080px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.who{display:flex;align-items:center;gap:10px}.av{width:32px;height:32px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--pr);color:var(--pt);padding:10px 20px;border-radius:var(--r);font-weight:600;font-size:14.5px;transition:transform .12s,opacity .15s;text-align:center}
.btn:hover{opacity:.88}.btn:active{transform:translateY(1px)}.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.s:hover{border-color:var(--tx);opacity:1}.btn[disabled]{opacity:.35;pointer-events:none}
.b{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;border-radius:3px;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.b.ok{background:var(--oks);color:var(--ok)}.b.wn{background:var(--wns);color:var(--wn)}.b.er{background:var(--ers);color:var(--er)}.b.in{background:var(--prs);color:var(--mu)}
.bar{height:6px;background:var(--prs);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.ok-f{background:var(--ok)}.wn-f{background:var(--wn)}.er-f{background:var(--er)}.pr-f{background:var(--tx)}
.crow{display:grid;grid-template-columns:170px 1fr 54px 150px;gap:18px;align-items:center;padding:16px 10px;border:0;border-bottom:1px solid var(--bd);background:none;width:100%;text-align:left;cursor:pointer}
.crow:last-child{border-bottom:0}.crow:hover{background:var(--prs)}.crow .num{font-size:24px}
ul.ev{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:9px}ul.ev li{display:flex;gap:11px}ul.ev li:before{content:"";flex:none;width:5px;height:5px;background:var(--er);margin-top:9px}
ul.ok li:before{background:var(--ok)}ul.wn li:before{background:var(--wn)}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:var(--r);background:var(--bg)}
input:focus,select:focus{border-color:var(--tx)}
.err{color:var(--er);font-size:13px;margin-top:4px}
.opt{display:flex;gap:14px;align-items:center;padding:15px 16px;border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;margin-bottom:10px;background:var(--sf);width:100%;text-align:left}
.opt:hover{border-color:var(--tx)}.opt.sel{border-color:var(--tx);background:var(--prs)}.opt.good{border-color:var(--ok);background:var(--oks)}.opt.bad{border-color:var(--er);background:var(--ers)}
.dot{width:30px;height:30px;border-radius:4px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-weight:600;font-size:13px;display:inline-grid;place-items:center;flex:none}.dot.cur{border-color:var(--tx);background:var(--tx);color:var(--bg)}.dot.ans{background:var(--prs)}.dot.fl{box-shadow:inset 0 -3px var(--wn)}
.step{display:flex;gap:16px;padding-bottom:24px;position:relative}.step:not(:last-child):before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1px;background:var(--bd)}
.node{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sf);border:1px solid var(--bd);color:var(--mu)}
.node.done{background:var(--ok);border-color:var(--ok);color:var(--pt)}.node.cur{border:2px solid var(--tx);color:var(--tx)}
.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.split{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.side{background:var(--tx);color:var(--bg);padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between}
.side h1{font-size:46px;max-width:480px}.side .ex{border:1px solid rgba(250,248,242,.22);border-radius:var(--r);padding:20px;max-width:440px;font-size:14px;background:rgba(250,248,242,.05)}
.fade{animation:f .4s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--tx)}td{padding:13px 10px;border-bottom:1px solid var(--bd)}tr.k{cursor:pointer}tr.k:hover{background:var(--prs)}
.hm{display:grid;grid-template-columns:130px repeat(5,1fr);gap:3px;font-size:13px}.hm div{padding:10px 6px;border-radius:3px;text-align:center;font-weight:600}.hm .h{color:var(--mu);font-size:11.5px;background:none;letter-spacing:.06em;text-transform:uppercase}.hm .n{text-align:left;background:none;font-weight:500}
.hm .ok{background:var(--oks);color:var(--ok)}.hm .wn{background:var(--wns);color:var(--wn)}.hm .er{background:var(--ers);color:var(--er)}
.seg{display:flex;border:1px solid var(--bd);border-radius:var(--r);padding:3px;gap:3px}.seg button{all:unset;flex:1;text-align:center;padding:8px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mu)}.seg button.on{background:var(--tx);color:var(--bg)}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:var(--r);font-weight:600;z-index:9}
.modal{position:fixed;inset:0;background:rgba(20,19,15,.55);display:grid;place-items:center;padding:20px;z-index:8}
.spin{width:16px;height:16px;border:2px solid var(--pt);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;display:inline-block;vertical-align:-3px;opacity:.8}@keyframes r{to{transform:rotate(360deg)}}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center}.ba .num{font-size:76px;line-height:1}
@media(max-width:820px){.app,.split{grid-template-columns:1fr}.side{display:none}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--bd)}.logo{display:none}.nav{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:13px 14px}.nav.on{border-bottom-color:var(--tx);background:none}main{padding:22px 16px 60px}h1{font-size:29px}.crow{grid-template-columns:1fr 50px;row-gap:8px}.crow .bar{grid-column:1/-1;order:3}.hide-s{display:none}.hm{grid-template-columns:90px repeat(5,1fr);font-size:11px}.ba .num{font-size:48px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div>
<script src="api.js"></script>
<script src="app.js"></script></body></html>
